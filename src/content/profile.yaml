intro: >-
  동의대학교 인공지능학과 박사과정에 재학 중이며, RECS Lab(지도교수 옥승호)에서 연구하고 있습니다.
  엣지 NPU(신경망 처리 장치)에서 언어 모델을 효율적으로 실행하고, 이를 로봇 제어 시스템에 통합하는 온디바이스 AI 공동설계를 연구합니다.
  동의대학교 로봇공학과에서 학사, 같은 대학 인공지능학과에서 석사 학위를 받았습니다.
  2024년 ㈜로이브를 창업해 CTO로 재직하고 있습니다.
description: >-
  동의대학교 인공지능학과 박사과정.
